# lit.cfg
import lit.formats
import os

# 配置lit使用自定义测试格式（默认使用RUN指令）
config.name = 'tap Compiler Tests'
config.test_format = lit.formats.ShTest(True)  # True表示开启内部shell

# 设置编译器路径（从环境变量读取或硬编码）
config.substitutions.append(
    ('%{compiler}', os.environ.get('YOUR_COMPILER', './build/tap'))
)

# 设置测试文件后缀
config.suffixes = ['.test']

# 可选：设置资源限制（防止测试卡死）
config.timeout = 30  # 单个测试30秒超时