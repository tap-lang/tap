name: MinGW-w64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mingw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 和 macOS/Linux/MSVC/Cygwin 统一用 LLVM 21。MSYS2 的 mingw-w64-llvm 现在已经是
  # 23.x，而仓库里保留了历史包，所以显式下载 21.1.8-4 的三个包用 pacman -U 降级。
  LLVM_PACKAGE_VERSION: "21.1.8-4"
  MSYS2_MINGW64_REPO: https://repo.msys2.org/mingw/mingw64

jobs:
  build-and-test:
    name: Windows 2022 / MinGW-w64 GCC / Release
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Install and pin LLVM 21
        # 先装当前的 llvm 把依赖（zlib / zstd / libffi / libxml2 / libedit ...）带齐，
        # 再降级到 21.1.8-4。pacman -U 不会自动解析依赖，直接降级会报 missing dependencies。
        # 注意：MSYS2 现在 mingw-w64-x86_64-llvm 已是 22.x，`pacman -S` 会顺带装进
        # mingw-w64-x86_64-lld 22，而 lld 22 要求 llvm-libs=22，所以降级必须把 lld 一并
        # 降到 21，否则报「breaks dependency 'llvm-libs=22.1.8' required by lld」。
        run: |
          export PATH="/mingw64/bin:$PATH"
          pacman -S --noconfirm --needed mingw-w64-x86_64-llvm
          pacman -U --noconfirm \
            "$MSYS2_MINGW64_REPO/mingw-w64-x86_64-llvm-libs-$LLVM_PACKAGE_VERSION-any.pkg.tar.zst" \
            "$MSYS2_MINGW64_REPO/mingw-w64-x86_64-llvm-tools-$LLVM_PACKAGE_VERSION-any.pkg.tar.zst" \
            "$MSYS2_MINGW64_REPO/mingw-w64-x86_64-llvm-$LLVM_PACKAGE_VERSION-any.pkg.tar.zst" \
            "$MSYS2_MINGW64_REPO/mingw-w64-x86_64-lld-$LLVM_PACKAGE_VERSION-any.pkg.tar.zst"

      - name: Verify LLVM
        # 主版本必须恰好是 21：和 macOS/Linux/MSVC/Cygwin 统一，避免各平台后端版本
        # 不一致难以归因。（mixed_signedness.tp 曾是 Cygwin 上唯一的 i128 除法用例，
        # 崩因是 libgcc 的 __divti3 与 LLVM Win64 libcall 约定不符，已在 runtime.c
        # 修复；和 LLVM 版本无关。）
        # /mingw64/bin 必须显式进 PATH：`msys2 {0}` shell 不一定带 MINGW64 环境，
        # llvm-config/cmake/ninja/gcc 全在 /mingw64/bin，缺了就是 exit 127。
        run: |
          export PATH="/mingw64/bin:$PATH"
          command -v llvm-config || { echo "::error::llvm-config 不在 PATH"; ls -la /mingw64/bin/llvm-config* 2>&1 || true; exit 1; }
          llvm-config --version
          test "$(llvm-config --version | cut -d. -f1)" = "21"
          llvm-config --cmakedir

      - name: Configure
        run: |
          export PATH="/mingw64/bin:$PATH"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DLLVM_DIR="$(llvm-config --cmakedir)" \
            -DBUILD_TESTS=ON

      - name: Build
        run: |
          export PATH="/mingw64/bin:$PATH"
          cmake --build build --parallel 2

      - name: Test
        # MinGW 的 lli 没有可靠的 JIT 环境，直接走 native 模式（和 Cygwin/MSVC 一致），
        # 每个用例生成真正的 .exe 再跑。/mingw64/bin 进 PATH 也保证 tap 链接时能找到 gcc。
        env:
          TEST_JOBS: "4"
          TEST_RUN_MODE: native
        run: |
          export PATH="/mingw64/bin:$PATH"
          sh tests/run-tests.sh ./build/tap.exe
