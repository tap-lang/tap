name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }} / Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / GCC
            os: ubuntu-24.04
            compiler: gcc
          - name: macOS / Clang
            os: macos-14
            compiler: clang
          - name: Windows / Clang
            os: windows-2022
            compiler: clang
    env:
      LLVM_VERSION: "21"
      LLVM_RELEASE: "21.1.8"
      LLVM_ROOT: ${{ github.workspace }}/.cache/llvm-21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore LLVM cache
        id: llvm-cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.LLVM_ROOT }}
          key: llvm-${{ env.LLVM_RELEASE }}-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Install LLVM 21 on Ubuntu
        if: runner.os == 'Linux' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm.sh --output /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install --yes "llvm-$LLVM_VERSION-dev" rsync

          mkdir --parents "$LLVM_ROOT"
          rsync --archive --copy-links --exclude='/build/' \
            "/usr/lib/llvm-$LLVM_VERSION/" "$LLVM_ROOT/"

      - name: Install LLVM 21 on macOS
        if: runner.os == 'macOS' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install llvm@21
          mkdir -p "$LLVM_ROOT"
          cp -RL "$(brew --prefix llvm@21)/." "$LLVM_ROOT/"

      - name: Install LLVM on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-llvm

      - name: Configure LLVM environment on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x "$LLVM_ROOT/bin/llvm-config"
          test -f "$LLVM_ROOT/lib/cmake/llvm/LLVMConfig.cmake"
          echo "$LLVM_ROOT/bin" >> "$GITHUB_PATH"
          echo "LLVM_CMAKE_DIR=$LLVM_ROOT/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Configure on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DLLVM_DIR="$LLVM_CMAKE_DIR"
          -DBUILD_TESTS=ON

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DLLVM_DIR=/ucrt64/lib/cmake/llvm
          -DBUILD_TESTS=ON

      - name: Build on Unix
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel 2

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel 2

      - name: Test on Unix
        if: runner.os != 'Windows'
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
