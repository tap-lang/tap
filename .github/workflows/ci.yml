name: MacOS/Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }} / Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / GCC
            os: ubuntu-24.04
            compiler: gcc
          - name: macOS 15 Intel / Clang
            os: macos-15-intel
            compiler: clang
          - name: macOS 26 ARM64 / Clang
            os: macos-26
            compiler: clang
    env:
      LLVM_VERSION: "21"
      LLVM_RELEASE: "21.1.8"
      LLVM_CACHE_ROOT: ${{ github.workspace }}/.cache/llvm-21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore LLVM cache
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LLVM_CACHE_ROOT }}
          key: llvm-${{ env.LLVM_RELEASE }}-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Install LLVM 21 on Ubuntu
        if: runner.os == 'Linux' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm.sh --output /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install --yes "llvm-$LLVM_VERSION-dev" rsync

          mkdir --parents "$LLVM_CACHE_ROOT"
          rsync --archive --copy-links --exclude='/build/' \
            "/usr/lib/llvm-$LLVM_VERSION/" "$LLVM_CACHE_ROOT/"

      - name: Install LLVM 21 on macOS
        if: runner.os == 'macOS' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install llvm@21
          mkdir -p "$LLVM_CACHE_ROOT"
          cp -RL "$(brew --prefix llvm@21)/." "$LLVM_CACHE_ROOT/"

      - name: Configure LLVM environment
        shell: bash
        run: |
          test -x "$LLVM_CACHE_ROOT/bin/llvm-config"
          test -f "$LLVM_CACHE_ROOT/lib/cmake/llvm/LLVMConfig.cmake"
          if [ "$(uname -s)" = "Darwin" ]; then
            chmod u+w "$LLVM_CACHE_ROOT/lib/libLLVM.dylib"
            install_name_tool -id "$LLVM_CACHE_ROOT/lib/libLLVM.dylib" "$LLVM_CACHE_ROOT/lib/libLLVM.dylib"
          fi
          echo "$LLVM_CACHE_ROOT/bin" >> "$GITHUB_PATH"
          echo "LLVM_CMAKE_DIR=$LLVM_CACHE_ROOT/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DLLVM_DIR="$LLVM_CMAKE_DIR"
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
