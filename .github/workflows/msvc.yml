name: MSVC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msvc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "21.1.8"
  LLVM_ROOT: ${{ github.workspace }}\.cache\llvm-21-msvc
  LLVM_INSTALLER: LLVM-21.1.8-win64.exe
  LLVM_INSTALLER_SHA256: 7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113

jobs:
  build-and-test:
    name: Windows 2022 / MSVC / Release
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Normalize line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore native LLVM cache
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LLVM_ROOT }}
          key: llvm-${{ env.LLVM_VERSION }}-windows-x64-msvc-v5

      - name: Checkout LLVM C API headers
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-21.1.8
          path: llvm-source
          fetch-depth: 1
          sparse-checkout: llvm/include/llvm-c

      - name: Install native LLVM 21
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $releaseRoot = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION"
          $installer = Join-Path $env:RUNNER_TEMP $env:LLVM_INSTALLER

          Write-Host "Downloading native Windows LLVM installer"
          curl.exe --fail --location --retry 3 --output $installer "$releaseRoot/$env:LLVM_INSTALLER"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download $env:LLVM_INSTALLER"
          }
          Write-Host "Verifying native Windows LLVM installer"
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($installerHash -ne $env:LLVM_INSTALLER_SHA256) {
            throw "LLVM installer checksum mismatch: expected $env:LLVM_INSTALLER_SHA256, got $installerHash"
          }

          Write-Host "Installing native Windows LLVM"
          $install = Start-Process -FilePath $installer `
            -ArgumentList @('/S', "/D=$env:LLVM_ROOT") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "LLVM installer failed with exit code $($install.ExitCode)"
          }

          Write-Host "Copying LLVM C API headers from sparse checkout"
          $headerSource = Join-Path $env:GITHUB_WORKSPACE "llvm-source\llvm\include\llvm-c"
          $includeRoot = Join-Path $env:LLVM_ROOT "include"
          if (-not (Test-Path (Join-Path $headerSource "Core.h"))) {
            throw "Sparse checkout did not provide LLVM C API headers: $headerSource"
          }
          New-Item -ItemType Directory -Force $includeRoot | Out-Null
          Copy-Item -Path $headerSource -Destination $includeRoot -Recurse -Force

          Write-Host "Generating LLVM configuration headers"
          $configRoot = Join-Path $includeRoot "llvm\Config"
          New-Item -ItemType Directory -Force $configRoot | Out-Null
          @'
          #ifndef LLVM_CONFIG_H
          #define LLVM_CONFIG_H
          #define LLVM_DEFAULT_TARGET_TRIPLE "x86_64-pc-windows-msvc"
          #define LLVM_HOST_TRIPLE "x86_64-pc-windows-msvc"
          #define LLVM_NATIVE_ARCH X86
          #define LLVM_NATIVE_ASMPARSER LLVMInitializeX86AsmParser
          #define LLVM_NATIVE_ASMPRINTER LLVMInitializeX86AsmPrinter
          #define LLVM_NATIVE_DISASSEMBLER LLVMInitializeX86Disassembler
          #define LLVM_NATIVE_TARGET LLVMInitializeX86Target
          #define LLVM_NATIVE_TARGETINFO LLVMInitializeX86TargetInfo
          #define LLVM_NATIVE_TARGETMC LLVMInitializeX86TargetMC
          #define LLVM_VERSION_MAJOR 21
          #define LLVM_VERSION_MINOR 1
          #define LLVM_VERSION_PATCH 8
          #define LLVM_VERSION_STRING "21.1.8"
          #define LLVM_ENABLE_LLVM_C_EXPORT_ANNOTATIONS
          #endif
          '@ | Set-Content -Path (Join-Path $configRoot "llvm-config.h") -Encoding ascii

          function Write-LlvmDefinition {
            param(
              [string]$Path,
              [string]$Macro,
              [string[]]$Targets
            )
            $lines = @(
              "#ifndef $Macro",
              "#  error Please define $Macro(TargetName)",
              '#endif',
              ''
            )
            $lines += $Targets | ForEach-Object { '{0}({1})' -f $Macro, $_ }
            $lines += '', "#undef $Macro"
            $lines | Set-Content -Path $Path -Encoding ascii
          }

          $targets = @('AArch64', 'ARM', 'BPF', 'NVPTX', 'RISCV', 'WebAssembly', 'X86')
          $nativeCodeTargets = @('AArch64', 'ARM', 'BPF', 'RISCV', 'WebAssembly', 'X86')
          Write-LlvmDefinition (Join-Path $configRoot "Targets.def") `
            'LLVM_TARGET' $targets
          Write-LlvmDefinition (Join-Path $configRoot "AsmPrinters.def") `
            'LLVM_ASM_PRINTER' $targets
          Write-LlvmDefinition (Join-Path $configRoot "AsmParsers.def") `
            'LLVM_ASM_PARSER' $nativeCodeTargets
          Write-LlvmDefinition (Join-Path $configRoot "Disassemblers.def") `
            'LLVM_DISASSEMBLER' $nativeCodeTargets

          Write-Host "Generating the MSVC import library for LLVM-C.dll"
          $llvmDll = Join-Path $env:LLVM_ROOT "bin\LLVM-C.dll"
          $llvmLibDir = Join-Path $env:LLVM_ROOT "lib"
          $llvmDef = Join-Path $llvmLibDir "LLVM-C.def"
          $llvmLib = Join-Path $llvmLibDir "LLVM-C.lib"
          New-Item -ItemType Directory -Force $llvmLibDir | Out-Null

          $exports = dumpbin.exe /nologo /exports $llvmDll | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(LLVM[A-Za-z0-9_]+)(?:\s|$)') {
              $Matches[1]
            }
          } | Sort-Object -Unique
          if ($exports.Count -lt 100) {
            throw "Unexpected LLVM-C export count: $($exports.Count)"
          }
          (@('LIBRARY LLVM-C', 'EXPORTS') + $exports) |
            Set-Content -Path $llvmDef -Encoding ascii
          lib.exe /nologo "/def:$llvmDef" /machine:x64 "/out:$llvmLib"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to generate LLVM-C.lib"
          }

      - name: Verify native LLVM 21
        shell: pwsh
        run: |
          $llvmHeader = Join-Path $env:LLVM_ROOT "include\llvm-c\Core.h"
          $llvmImportLibrary = Join-Path $env:LLVM_ROOT "lib\LLVM-C.lib"
          $llvmDll = Join-Path $env:LLVM_ROOT "bin\LLVM-C.dll"
          $clang = Join-Path $env:LLVM_ROOT "bin\clang.exe"
          $clangCl = Join-Path $env:LLVM_ROOT "bin\clang-cl.exe"
          $llvmConfigHeader = Join-Path $env:LLVM_ROOT "include\llvm\Config\llvm-config.h"
          $llvmTargetDefinitions = @(
            "Targets.def",
            "AsmPrinters.def",
            "AsmParsers.def",
            "Disassemblers.def"
          ) | ForEach-Object {
            Join-Path $env:LLVM_ROOT "include\llvm\Config\$_"
          }
          $requiredFiles = @(
            $llvmHeader,
            $llvmConfigHeader,
            $llvmImportLibrary,
            $llvmDll,
            $clang,
            $clangCl
          ) + $llvmTargetDefinitions

          foreach ($path in $requiredFiles) {
            if (-not (Test-Path $path)) {
              throw "Required native LLVM file is missing: $path"
            }
          }

          $versionOutput = (& $clang --version) -join "`n"
          $hostTarget = (& $clang -print-target-triple).Trim()
          if ($versionOutput -notmatch "clang version $([regex]::Escape($env:LLVM_VERSION))") {
            throw "Expected LLVM $env:LLVM_VERSION, got:`n$versionOutput"
          }
          if ($hostTarget -notmatch "windows-msvc$") {
            throw "Expected an MSVC ABI LLVM build, got target $hostTarget"
          }

          Write-Host ($versionOutput -split "`n")[0]
          Write-Host "LLVM host target: $hostTarget"
          (Join-Path $env:LLVM_ROOT "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $env:ProgramFiles "Git\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure with MSVC
        shell: pwsh
        run: |
          $llvmRoot = $env:LLVM_ROOT.Replace('\', '/')
          cmake -S . -B build-msvc `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -T host=x64 `
            "-DTAP_LLVM_C_ROOT=$llvmRoot" `
            -DBUILD_TESTS=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

          $compilerFile = Get-ChildItem build-msvc -Recurse -Filter CMakeCCompiler.cmake |
            Select-Object -First 1
          if (-not $compilerFile -or
              -not (Select-String -Path $compilerFile.FullName -Pattern 'CMAKE_C_COMPILER_ID "MSVC"' -Quiet)) {
            throw "CMake did not select the MSVC C compiler"
          }

      - name: Build
        shell: pwsh
        run: cmake --build build-msvc --config Release --parallel 2

      - name: Test
        shell: pwsh
        env:
          TEST_JOBS: "2"
          TEST_RUN_MODE: native
        run: ctest --test-dir build-msvc --build-config Release --output-on-failure

      - name: Save native LLVM cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LLVM_ROOT }}
          key: llvm-${{ env.LLVM_VERSION }}-windows-x64-msvc-v5
