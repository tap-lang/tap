name: Cygwin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cygwin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cygwin 镜像同时保留多个 LLVM 版本（当前有 20/21/22/23）。setup.exe 支持
  # `-P pkg=version` 钉版本，所以下面直接把 LLVM 相关包钉在 21.1.8-2，和
  # macOS/Linux/MSVC 用的 21.x 保持一致。不钉的话 `allow-test-packages` 会拿到
  # 最新的 23.1.1，LLVM 23 的 codegen 差异会让部分用例在 Cygwin 上崩溃。
  LLVM_VERSION: "21.1.8-2"
  CYGWIN_ROOT: D:\cygwin64

jobs:
  build-and-test:
    name: Windows 2022 / Cygwin Clang / Release
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Normalize line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Cygwin cache
        id: cygwin-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CYGWIN_ROOT }}
          # 版本后缀从 v2 升到 v3：旧缓存里是 LLVM 23，必须重建。
          key: cygwin-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Prepare Cygwin
        if: steps.cygwin-cache.outputs.cache-hit != 'true'
        uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: ${{ env.CYGWIN_ROOT }}
          # LLVM 相关包钉死在 21.1.8-2（setup.exe 的 `-P pkg=version` 语法）。
          # 其余包跟随镜像最新版。
          allow-test-packages: 'true'
          packages: |
            clang=${{ env.LLVM_VERSION }}
            cmake
            ninja
            llvm=${{ env.LLVM_VERSION }}
            libllvm-devel=${{ env.LLVM_VERSION }}
            libpolly-devel=${{ env.LLVM_VERSION }}
            zlib-devel
            libzstd-devel
            libxml2-devel
            libedit-devel
            git

      - name: Verify LLVM
        # 断言「主版本恰好是 21」，而不是之前的 >= 21：Cygwin 镜像会同时保留
        # 20/21/22/23，allow-test-packages 默认取最新（23），那样就和其它平台
        # 用的 21.x 不一致了。版本对不上直接失败，不要拖到测试阶段。
        shell: D:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: >-
          export PATH=/usr/bin:$(cygpath "${SYSTEMROOT}")/system32 &&
          test -x /usr/bin/llvm-config &&
          test -f /usr/lib/cmake/llvm/LLVMConfig.cmake &&
          llvm_version=$(llvm-config --version) &&
          echo "Cygwin LLVM version: ${llvm_version}" &&
          test "${llvm_version%%.*}" -eq 21

      - name: Save Cygwin cache
        if: steps.cygwin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CYGWIN_ROOT }}
          key: cygwin-${{ env.LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Configure
        shell: D:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: >-
          export PATH=/usr/bin:$(cygpath "${SYSTEMROOT}")/system32 &&
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DLLVM_DIR=/usr/lib/cmake/llvm
          -DBUILD_TESTS=ON

      - name: Build
        shell: D:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: >-
          export PATH=/usr/bin:$(cygpath "${SYSTEMROOT}")/system32 &&
          cmake --build build --parallel 2

      - name: Test
        # Cygwin 的 lli 有两个无法在 tap 侧规避的限制，fast 模式必然有 5 个用例失败：
        #   1. JIT 里的 exit() 不传递退出码（实测最小 IR 直接 call exit(1) 仍返回 0），
        #      导致 4 个 run-fail 用例的 .exit 期望无法满足；
        #   2. 栈帧超过 4KB 时 LLVM 插入的 ___chkstk_ms 在 Cygwin 的 lli 里解析不到
        #      （env_var.tp 有 [string; 256]，触发该问题）。
        # 因此与 msvc.yml 一致改走 native 模式；完整用例只在 Cygwin 的原生可执行文件上验证。
        # 不通过 ctest 转发，否则 CTest 会缓存脚本输出，Actions 日志看不到实时进度。
        shell: D:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        env:
          TEST_JOBS: "4"
          TEST_RUN_MODE: native
        run: >-
          export PATH=/usr/bin:$(cygpath "${SYSTEMROOT}")/system32 &&
          sh tests/run-tests.sh ./build/tap.exe
