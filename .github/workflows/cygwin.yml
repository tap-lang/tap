name: Cygwin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cygwin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 仅作为 Cygwin 缓存键的版本标记：Cygwin 侧实际安装的 LLVM 版本由下面的
  # packages 列表决定（稳定版仓库仍是 LLVM 20.x，需要 test 包才能拿到 21）。
  LLVM_RELEASE: "21.1.8"
  CYGWIN_ROOT: D:\cygwin64

jobs:
  build-and-test:
    name: Windows 2022 / Cygwin Clang / Release
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Normalize line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Cygwin cache
        id: cygwin-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CYGWIN_ROOT }}
          key: cygwin-${{ env.LLVM_RELEASE }}-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Prepare Cygwin
        if: steps.cygwin-cache.outputs.cache-hit != 'true'
        uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: ${{ env.CYGWIN_ROOT }}
          # Stable Cygwin still ships LLVM 20.x; this repo requires LLVM >= 21.
          allow-test-packages: 'true'
          packages: |
            clang
            cmake
            ninja
            llvm
            libllvm-devel
            libpolly-devel
            zlib-devel
            libzstd-devel
            libxml2-devel
            libedit-devel
            git

      - name: Verify LLVM
        # Cygwin 的 LLVM 来自 test packages，具体版本由镜像决定，无法像 msvc.yml 那样钉死。
        # 因此这里显式记录版本并按 CMake 的同一条规则断言（主版本 >= 21）：拿到 20.x 或
        # 过期的缓存时直接失败，而不是在后续测试里表现为难以定位的偶发错误。
        shell: D:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: >-
          export PATH=/usr/bin:$(cygpath "${SYSTEMROOT}")/system32 &&
          test -x /usr/bin/llvm-config &&
          test -f /usr/lib/cmake/llvm/LLVMConfig.cmake &&
          llvm_version=$(llvm-config --version) &&
          echo "Cygwin LLVM version: ${llvm_version}" &&
          test "${llvm_version%%.*}" -ge 21

      - name: Save Cygwin cache
        if: steps.cygwin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CYGWIN_ROOT }}
          key: cygwin-${{ env.LLVM_RELEASE }}-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Configure
        shell: D:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: >-
          export PATH=/usr/bin:$(cygpath "${SYSTEMROOT}")/system32 &&
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DLLVM_DIR=/usr/lib/cmake/llvm
          -DBUILD_TESTS=ON

      - name: Build
        shell: D:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: >-
          export PATH=/usr/bin:$(cygpath "${SYSTEMROOT}")/system32 &&
          cmake --build build --parallel 2

      - name: Test
        # Cygwin 的 lli 有两个无法在 tap 侧规避的限制，fast 模式必然有 5 个用例失败：
        #   1. JIT 里的 exit() 不传递退出码（实测最小 IR 直接 call exit(1) 仍返回 0），
        #      导致 4 个 run-fail 用例的 .exit 期望无法满足；
        #   2. 栈帧超过 4KB 时 LLVM 插入的 ___chkstk_ms 在 Cygwin 的 lli 里解析不到
        #      （env_var.tp 有 [string; 256]，触发该问题）。
        # 因此与 msvc.yml 一致改走 native 模式，实测 88/88 全过。
        shell: D:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        env:
          TEST_JOBS: "2"
          TEST_RUN_MODE: native
        run: >-
          export PATH=/usr/bin:$(cygpath "${SYSTEMROOT}")/system32 &&
          ctest --test-dir build --output-on-failure
